<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Horário</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Horário</h1><button id="notif" type="button">Activar lembretes</button></header>
<nav>
  <button class="tab on" data-v="horario">Horário</button>
  <button class="tab" data-v="tarefas">Tarefas</button>
</nav>
<main>
  <section id="horario">
    <form id="fAula">
      <select name="dia"><option value="1">Segunda</option><option value="2">Terça</option><option value="3">Quarta</option><option value="4">Quinta</option><option value="5">Sexta</option><option value="6">Sábado</option></select>
      <input name="disciplina" placeholder="Disciplina" required>
      <input name="inicio" type="time" required>
      <input name="fim" type="time" required>
      <input name="sala" placeholder="Sala">
      <button>Adicionar aula</button>
    </form>
    <div id="listaAulas"></div>
  </section>
  <section id="tarefas" hidden>
    <form id="fTarefa">
      <input name="titulo" placeholder="Tarefa" required>
      <input name="disciplina" placeholder="Disciplina">
      <select name="tipo"><option>Trabalho</option><option>Teste</option><option>Exame</option><option>Outro</option></select>
      <input name="data" type="date" required>
      <button>Adicionar tarefa</button>
    </form>
    <div id="listaTarefas"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
